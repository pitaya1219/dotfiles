version: '3'

env:
  LOGSEQ_LOCAL: '{{if .LOGSEQ_LOCAL}}{{.LOGSEQ_LOCAL}}{{else}}{{env "HOME"}}/logseq{{end}}'
  LOGSEQ_REMOTE: '{{.LOGSEQ_REMOTE | default "app/logseq"}}'
  LOG_FILE: '{{if .LOG_FILE}}{{.LOG_FILE}}{{else}}{{env "HOME"}}/.local/share/logseq-sync.log{{end}}'
  BACKUP_DIR: '{{if .BACKUP_DIR}}{{.BACKUP_DIR}}{{else}}{{env "HOME"}}/.local/share/logseq-backups{{end}}'
  EXCLUDE: '{{.EXCLUDE | default ".git/**,node_modules/**,\\.DS_Store,logseq/.recycle/**"}}'
  SHRINK_RATIO: '{{.SHRINK_RATIO | default "50"}}'
  SHRINK_MIN_BYTES: '{{.SHRINK_MIN_BYTES | default "64"}}'

vars:
  BACKUP_LOG_DIR: '{{if .BACKUP_LOG_DIR}}{{.BACKUP_LOG_DIR}}{{else}}~/.local/share/task/sync/logs{{end}}'
  BACKUP_TIMESTAMP: '{{now | date "20060102"}}'
  BACKUP_LOG_FILE: '{{.BACKUP_LOG_DIR}}/backup-{{.BACKUP_TIMESTAMP}}.log'

tasks:
  default:
    desc: Sync logseq folder with cloud (bidirectional)
    aliases: [bi]
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        # Backup first (skip during dry-run)
        if [[ "{{.CLI_ARGS}}" != *--dry-run* ]]; then
            task sync:logseq:_backup
        else
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Skipping backup (dry-run mode)" >> "${LOG_FILE}"
            echo "Skipping backup (dry-run mode)"
        fi
        
        # Check if resync needed by looking at local .lst file (rclone stores these locally, not on remote)
        LST_GLOB="${HOME}/.cache/rclone/bisync/*$(basename "{{.LOGSEQ_LOCAL}}")*.path1.lst"
        if compgen -G "$LST_GLOB" > /dev/null 2>&1; then
            RESYNC=""
        else
            RESYNC="--resync"
        fi
        
        export LOGSEQ_LOCAL="{{.LOGSEQ_LOCAL}}"
        export LOGSEQ_REMOTE="{{.LOGSEQ_REMOTE}}"
        export LOG_FILE="{{.LOG_FILE}}"
        
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Starting bidirectional sync" >> "$LOG_FILE"
        EXCLUDE_ARGS="{{.EXCLUDE}}"
        if [[ -n "${TERMUX_VERSION:-}" ]] || [[ -d /data/data/com.termux ]]; then
            EXCLUDE_ARGS="${EXCLUDE_ARGS},logseq/bak/**"
        fi
        set +e
        task sync:bisync:pcloud SOURCE_DIR="$LOGSEQ_LOCAL" ENCRYPT_SUBDIR="$LOGSEQ_REMOTE" PARENT_DIR="" EXCLUDE="$EXCLUDE_ARGS" -- $RESYNC {{.CLI_ARGS}}
        SYNC_RESULT=$?
        set -e
        
        if [[ ${SYNC_RESULT:-0} -ne 0 ]]; then
            echo "Sync failed with exit code ${SYNC_RESULT:-0}" >> "$LOG_FILE"
            task sync:logseq:notify TITLE="Logseq Sync Failed" MESSAGE="Sync failed" PRIORITY="high"
            exit ${SYNC_RESULT:-0}
        fi
        
        # Conflict resolution - skip during dry-run
        if [[ "{{.CLI_ARGS}}" != *--dry-run* ]]; then
            task sync:logseq:_conflict
        else
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Skipping conflict resolution (dry-run mode)" >> "${LOG_FILE}"
            echo "Skipping conflict resolution (dry-run mode)"
        fi

        # Shrink check - skip during dry-run.
        # Deliberately runs AFTER _conflict, not before. Both write to the same
        # pages/conflict-<name>.md path, but _conflict truncates it (">") while
        # _shrink_check appends, so shrink-first would have its report silently
        # clobbered whenever both fire for the same page in one run. Running
        # second also lets _shrink_check compare against any base file _conflict
        # restored from a conflict copy, instead of reporting it as missing.
        if [[ "{{.CLI_ARGS}}" != *--dry-run* ]]; then
            task sync:logseq:_shrink_check
        else
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Skipping shrink check (dry-run mode)" >> "${LOG_FILE}"
            echo "Skipping shrink check (dry-run mode)"
        fi
        INNEREOF

  test:
    desc: Dry run for bidirectional sync
    cmd:
      task: default
      vars:
        CLI_ARGS: '--dry-run {{.CLI_ARGS}}'

  up:
    desc: Sync logseq folder with cloud (local -> cloud)
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        export LOGSEQ_LOCAL="{{.LOGSEQ_LOCAL}}"
        export LOGSEQ_REMOTE="{{.LOGSEQ_REMOTE}}"
        echo "Starting upload sync" >> "{{.LOG_FILE}}"
        set +e
        task sync:up:pcloud SOURCE_DIR="$LOGSEQ_LOCAL" ENCRYPT_SUBDIR="$LOGSEQ_REMOTE" PARENT_DIR="" EXCLUDE="{{.EXCLUDE}}" -- {{.CLI_ARGS}}
        SYNC_RESULT=$?
        set -e
        if [[ $SYNC_RESULT -ne 0 ]]; then
            task sync:logseq:notify TITLE="Logseq Sync Failed" MESSAGE="Upload failed" PRIORITY="high"
            exit $SYNC_RESULT
        fi
        INNEREOF

  down:
    desc: Sync logseq folder with cloud (cloud -> local)
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        export LOGSEQ_LOCAL="{{.LOGSEQ_LOCAL}}"
        export LOGSEQ_REMOTE="{{.LOGSEQ_REMOTE}}"
        echo "Starting download sync" >> "{{.LOG_FILE}}"
        EXCLUDE_ARGS="{{.EXCLUDE}}"
        if [[ -n "${TERMUX_VERSION:-}" ]] || [[ -d /data/data/com.termux ]]; then
            EXCLUDE_ARGS="${EXCLUDE_ARGS},logseq/bak/**"
        fi
        set +e
        task sync:down:pcloud DIST_DIR="$LOGSEQ_LOCAL" ENCRYPT_SUBDIR="$LOGSEQ_REMOTE" PARENT_DIR="" EXCLUDE="$EXCLUDE_ARGS" -- {{.CLI_ARGS}}
        SYNC_RESULT=$?
        set -e
        if [[ $SYNC_RESULT -ne 0 ]]; then
            task sync:logseq:notify TITLE="Logseq Sync Failed" MESSAGE="Download failed" PRIORITY="high"
            exit $SYNC_RESULT
        fi
        INNEREOF

  _backup:
    desc: "[INTERNAL] Create backup of logseq journals and pages - do not call directly"
    preconditions:
      - sh: 'test -d "{{.LOGSEQ_LOCAL}}"'
        msg: "LOGSEQ_LOCAL directory not found: {{.LOGSEQ_LOCAL}}"
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        mkdir -p "{{.BACKUP_DIR}}"
        BACKUP_DATE=$(date '+%Y%m%d_%H%M%S')
        BACKUP_PATH="{{.BACKUP_DIR}}/$BACKUP_DATE"
        mkdir -p "$BACKUP_PATH"
        for dir in journals pages; do
            if [[ -d "{{.LOGSEQ_LOCAL}}/$dir" ]]; then
                cp -r "{{.LOGSEQ_LOCAL}}/$dir" "$BACKUP_PATH/" 2>/dev/null || true
            fi
        done
        # Record the snapshot just taken so _shrink_check can diff against the
        # pre-sync state without re-deriving "latest". Must be dotfile-named:
        # the generation-pruning line below lists with plain `ls`, which does
        # not show dotfiles, so a non-dot pointer file would eventually get
        # swept up and rm -rf'd as if it were a backup generation.
        echo "$BACKUP_PATH" > "{{.BACKUP_DIR}}/.last"
        (cd "{{.BACKUP_DIR}}" && ls -t | tail -n +6 | xargs rm -rf 2>/dev/null) || true
        INNEREOF

  _conflict:
    desc: "[INTERNAL] Restore from conflict files - do not call directly"
    preconditions:
      - sh: 'test -d "{{.LOGSEQ_LOCAL}}"'
        msg: "LOGSEQ_LOCAL directory not found: {{.LOGSEQ_LOCAL}}"
      - sh: 'test "$(bash -c "echo \${BASH_VERSINFO[0]}")" -ge 4'
        msg: "bash >= 4 required for conflict resolution"
    cmds:
      - |
        bash <<'INNEREOF'
        set -uo pipefail
        LOGSEQ_LOCAL="{{.LOGSEQ_LOCAL}}"
        
        # Function to URL-decode strings (for handling rclone URL-encoded filenames)
        url_decode() {
            python3 -c "import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))" <<< "$1"
        }

        # Convert a page's on-disk basename back to its real Logseq page name,
        # so [[links]] built from it resolve instead of pointing at a dead page.
        # Reverses both URL-encoding and the "___" namespace separator Logseq
        # substitutes for "/" in hierarchical (namespace) page filenames.
        page_name_from_basename() {
            local decoded
            decoded=$(url_decode "$1")
            echo "${decoded//___//}"
        }

        # Run a unified diff and print it, distinguishing "files differ" (diff
        # exit 1, the expected case whenever we get here) from a real failure
        # (exit >=2). With `pipefail`, piping straight into `tail` would make
        # the normal "differ" exit code look like an error and print a
        # spurious "(Could not compute diff)" after already-correct output.
        safe_diff() {
            local output status
            output=$(diff -u "$1" "$2" 2>/dev/null)
            status=$?
            if [[ $status -ge 2 ]]; then
                echo "(Could not compute diff)"
            else
                echo "$output" | tail -n +4
            fi
        }

        # Conflict pages and rclone's *.partial leftovers are artifacts of the
        # sync itself, not notes. Reporting on them yields a report about a
        # report, and because each report embeds the previous one, the chain
        # compounds instead of converging.
        is_sync_artifact() {
            local name
            name=$(basename "$1")
            [[ "$name" == conflict-*.md ]] || [[ "$name" == *.partial* ]]
        }

        # Each device only ever writes to its own {machine} namespace, so a page
        # can never be modified on two peers at once - bisync sees a one-sided
        # change and propagates it cleanly, with no *.conflict copy and so no
        # possibility of the page conflicting with itself. {TODAY} keys each
        # family by the day it was detected (not the original page's own date,
        # which for non-journal pages there isn't one) so a later, unrelated
        # conflict on the same page can never silently clobber an earlier
        # unmerged report - see conflict_stem/next_conflict_slot below.
        # printf, not echo: echo's trailing newline would otherwise survive
        # tr's -c complement translation as a trailing '-'.
        MACHINE_NAME=$(printf '%s' "${SYNC_MACHINE_NAME:-$(hostname -s 2>/dev/null || echo unknown)}" | tr -c 'A-Za-z0-9_-' '-')
        TODAY=$(date '+%Y-%m-%d')

        # The family of report pages about one original page, detected on one
        # machine, on one day. conflict_stem identifies the family;
        # next_conflict_slot/latest_conflict_slot pick a member within it.
        conflict_stem() {
            local date_str
            date_str=$(echo "$1" | tr '_' '-')
            echo "conflict-${MACHINE_NAME}-${TODAY}-${date_str}"
        }

        # A never-before-used path in this family - unsuffixed for the first
        # report today, then -2, -3, ... Always fresh, so writers here never
        # append to or overwrite an earlier report; a full write to a new path
        # is bounded by the current divergence, not by what came before.
        next_conflict_slot() {
            local stem="$1" n=1 candidate
            candidate="$LOGSEQ_LOCAL/pages/${stem}.md"
            while [[ -f "$candidate" ]]; do
                n=$((n + 1))
                candidate="$LOGSEQ_LOCAL/pages/${stem}-${n}.md"
            done
            echo "$candidate"
        }

        # The most recently allocated path in this family, or empty if today's
        # family has no members yet.
        latest_conflict_slot() {
            local stem="$1" latest="" max=0 f n
            if [[ -f "$LOGSEQ_LOCAL/pages/${stem}.md" ]]; then
                latest="$LOGSEQ_LOCAL/pages/${stem}.md"
                max=1
            fi
            for f in "$LOGSEQ_LOCAL/pages/${stem}-"*.md; do
                [[ -f "$f" ]] || continue
                n="${f#"$LOGSEQ_LOCAL/pages/${stem}-"}"
                n="${n%.md}"
                [[ "$n" =~ ^[0-9]+$ ]] || continue
                if (( n > max )); then
                    max=$n
                    latest="$f"
                fi
            done
            echo "$latest"
        }

        ALL_CONFLICTS=$(find "$LOGSEQ_LOCAL/journals" "$LOGSEQ_LOCAL/pages" -name "*.conflict*" 2>/dev/null || true)
        if [[ -z "$ALL_CONFLICTS" ]]; then exit 0; fi
        echo "Processing conflict files:"
        echo "$ALL_CONFLICTS"
        declare -A conflict_groups
        while IFS= read -r conflict_file; do
            [[ -z "$conflict_file" ]] && continue
            base_file="${conflict_file%%.conflict*}"
            [[ "$base_file" != *.md ]] && base_file="${base_file}.md"
            # URL-decode the base filename to match actual Logseq files
            base_file_decoded=$(url_decode "$base_file")
            if [[ -z "${conflict_groups[$base_file_decoded]:-}" ]]; then
                conflict_groups[$base_file_decoded]="$conflict_file"
            else
                conflict_groups[$base_file_decoded]="${conflict_groups[$base_file_decoded]}|$conflict_file"
            fi
        done <<< "$ALL_CONFLICTS"
        HAS_CONFLICTS=false
        for base_file in "${!conflict_groups[@]}"; do
            IFS='|' read -ra conflict_array <<< "${conflict_groups[$base_file]}"
            # Drop the copies and move on rather than reporting on them.
            #
            # This branch used to append diff(copy, page) back into the page
            # itself. That fed each round's diff its own previous output, so the
            # page grew by roughly its own size every round: 24 rounds reached
            # 136MB and took Logseq's renderer down with it. The appended diff
            # never carried anything unique either - it restated the page's own
            # Version blocks, the report's `created::` timestamp, and the hunk
            # headers of the diff it was diffing. Whole timestamped generations
            # of the page survive in logseq/bak/ regardless.
            if is_sync_artifact "$base_file"; then
                for cf in "${conflict_array[@]}"; do
                    [[ -f "$cf" ]] && rm -f "$cf" 2>/dev/null || true
                done
                continue
            fi
            has_diff=false
            # base_file is already URL-decoded from the associative array key
            # This is the name we want to use (decoded version)
            # But the actual file on disk might be encoded, so we need to check both
            actual_base="$base_file"
            if ! [[ -f "$actual_base" ]]; then
                # Try to find a file with URL-encoded name
                encoded_base=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$base_file")
                if [[ -f "$encoded_base" ]]; then
                    actual_base="$encoded_base"
                fi
            fi
            if [[ -f "$actual_base" ]] && [[ -f "${conflict_array[0]}" ]]; then
                diff -q "$actual_base" "${conflict_array[0]}" >/dev/null 2>&1 || has_diff=true
            elif [[ ! -f "$actual_base" ]] || [[ ! -f "${conflict_array[0]}" ]]; then
                has_diff=true
            fi
            if $has_diff; then
                HAS_CONFLICTS=true
                basename=$(basename "$base_file" .md)
                page_name=$(page_name_from_basename "$basename")
                mkdir -p "$LOGSEQ_LOCAL/pages"
                conflict_page=$(next_conflict_slot "$(conflict_stem "$basename")")
                timestamp=$(date '+%Y-%m-%d %H:%M:%S')
                # Build one ordered list of the versions that actually exist on
                # disk (each conflict first, then the current file last). Both
                # the Diff Summary and the Version blocks below index into this
                # list, so their numbering always agrees, and the version number
                # increases with recency (Version 1 = oldest, last = current/
                # newer) matching normal version-numbering intuition. Doing it
                # once also means the summary reflects reality instead of a
                # generic "multiple" claim.
                version_files=()
                version_labels=()
                for cf in "${conflict_array[@]}"; do
                    if [[ -f "$cf" ]]; then
                        version_files+=("$cf")
                        version_labels+=("Conflict/Older")
                    fi
                done
                if [[ -f "$actual_base" ]]; then
                    version_files+=("$actual_base")
                    version_labels+=("Current/Newer")
                fi
                num_versions=${#version_files[@]}
                {
                    echo "tags:: #conflict"
                    echo "created:: $timestamp"
                    echo ""
                    echo "# Conflict detected: [[${page_name}]]"
                    echo ""
                    echo "${num_versions} version(s) of [[${page_name}]] were found during sync (see Diff Summary and Versions below)."
                    echo "## Diff Summary"
                    echo ""
                    echo "Legend: removed | added | unchanged"
                    echo ""
                    if [[ $num_versions -lt 2 ]]; then
                        # Only one version reached disk (e.g. actual_base was not
                        # found and a single conflict file remained). A diff needs
                        # two sides, so say so explicitly rather than silently
                        # omitting the section.
                        echo "Only ${num_versions} version was available on disk, so no diff could be computed. See the Version block(s) below for the full text."
                        echo ""
                    else
                        # Diff every consecutive pair of versions. This covers all
                        # versions when there are 3+ (the previous code only diffed
                        # the first conflict against the current file), and still
                        # works when actual_base is missing, since it then diffs the
                        # remaining conflict versions against each other.
                        # Args are passed (earlier, later) matching the header's
                        # "Version i vs Version i+1" order, so diff's "old new"
                        # convention holds: "-" marks lines only in Version i,
                        # "+" marks lines only in Version i+1.
                        for ((i = 1; i < num_versions; i++)); do
                            echo "### Version $i (${version_labels[$((i - 1))]}) vs Version $((i + 1)) (${version_labels[$i]})"
                            echo ""
                            echo '```'
                            safe_diff "${version_files[$((i - 1))]}" "${version_files[$i]}"
                            echo '```'
                            echo ""
                        done
                    fi
                    for ((i = 0; i < num_versions; i++)); do
                        echo "## Version $((i + 1)) (${version_labels[$i]})"
                        echo "- collapsed:: true"
                        sed 's/^/\t/' "${version_files[$i]}" 2>/dev/null || echo "(Could not read file: ${version_files[$i]})"
                        echo ""
                    done
                    echo "---"
                    echo "After merging, update and delete this page."
                } > "$conflict_page"
            fi
            # If the actual file doesn't exist, restore from the largest conflict file
            # (must happen BEFORE deleting conflict files)
            if [[ ! -f "$actual_base" ]]; then
                largest=""
                max_size=0
                for cf in "${conflict_array[@]}"; do
                    if [[ -f "$cf" ]]; then
                        size=$(stat -f%z "$cf" 2>/dev/null || stat -c%s "$cf" 2>/dev/null || echo "0")
                        [[ $size -gt $max_size ]] && max_size=$size && largest="$cf"
                    fi
                done
                [[ -n "$largest" ]] && cp "$largest" "$base_file" 2>/dev/null || true
            fi
            for cf in "${conflict_array[@]}"; do
                [[ -f "$cf" ]] && rm -f "$cf" 2>/dev/null || true
            done
        done
        # Must not be `$HAS_CONFLICTS && task ...`: that leaves the task's exit
        # status at 1 whenever nothing was reported, and the caller runs under
        # `set -e`, so a run that only had sync artifacts to drop would abort
        # the sync before _shrink_check ever got to run.
        if $HAS_CONFLICTS; then
            task sync:logseq:notify TITLE="Conflicts Detected" MESSAGE="Found conflict files" PRIORITY="high"
        fi
        INNEREOF

  _shrink_check:
    desc: "[INTERNAL] Detect files that shrank drastically during sync - do not call directly"
    preconditions:
      - sh: 'test -d "{{.LOGSEQ_LOCAL}}"'
        msg: "LOGSEQ_LOCAL directory not found: {{.LOGSEQ_LOCAL}}"
    cmds:
      - |
        bash <<'INNEREOF'
        # Catches the failure rclone bisync cannot: with three peers (Mac, rose,
        # Android) a device that edits before pulling another's change looks like
        # a one-sided update, so bisync propagates it without ever flagging a
        # conflict and the other side's content is silently overwritten.
        #
        # The comparison is pre-sync snapshot (taken by _backup) vs the tree after
        # the sync, so it cannot distinguish "the sync destroyed this" from "you
        # deleted a large block yourself while the sync was running" — the latter
        # is reported too. That is the intended trade: a false positive costs one
        # extra conflict page, a false negative costs the content. Raise
        # SHRINK_RATIO to report more, lower it to report less.
        set -uo pipefail
        LOGSEQ_LOCAL="{{.LOGSEQ_LOCAL}}"
        BACKUP_DIR="{{.BACKUP_DIR}}"
        LOG_FILE="{{.LOG_FILE}}"
        SHRINK_RATIO="{{.SHRINK_RATIO}}"
        SHRINK_MIN_BYTES="{{.SHRINK_MIN_BYTES}}"

        # Function to URL-decode strings (for handling rclone URL-encoded filenames)
        url_decode() {
            python3 -c "import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))" <<< "$1"
        }

        # Convert a page's on-disk basename back to its real Logseq page name,
        # so [[links]] built from it resolve instead of pointing at a dead page.
        # Reverses both URL-encoding and the "___" namespace separator Logseq
        # substitutes for "/" in hierarchical (namespace) page filenames.
        page_name_from_basename() {
            local decoded
            decoded=$(url_decode "$1")
            echo "${decoded//___//}"
        }

        # Run a unified diff and print it, distinguishing "files differ" (diff
        # exit 1, the expected case whenever we get here) from a real failure
        # (exit >=2). See sync:logseq:_conflict for the full rationale.
        safe_diff() {
            local output status
            output=$(diff -u "$1" "$2" 2>/dev/null)
            status=$?
            if [[ $status -ge 2 ]]; then
                echo "(Could not compute diff)"
            else
                echo "$output" | tail -n +4
            fi
        }

        # Conflict pages and rclone's *.partial leftovers are artifacts of the
        # sync itself, not notes. Reporting on them yields a report about a
        # report, and because each report embeds the previous one, the chain
        # compounds instead of converging.
        is_sync_artifact() {
            local name
            name=$(basename "$1")
            [[ "$name" == conflict-*.md ]] || [[ "$name" == *.partial* ]]
        }

        # Each device only ever writes to its own {machine} namespace, so a page
        # can never be modified on two peers at once - bisync sees a one-sided
        # change and propagates it cleanly, with no *.conflict copy and so no
        # possibility of the page conflicting with itself. TODAY keys each
        # family by the day it was detected (not the original page's own date,
        # which for non-journal pages there isn't one) so a later, unrelated
        # conflict on the same page can never silently clobber an earlier
        # unmerged report - see conflict_stem/next_conflict_slot below.
        # printf, not echo: echo's trailing newline would otherwise survive
        # tr's -c complement translation as a trailing '-'.
        MACHINE_NAME=$(printf '%s' "${SYNC_MACHINE_NAME:-$(hostname -s 2>/dev/null || echo unknown)}" | tr -c 'A-Za-z0-9_-' '-')
        TODAY=$(date '+%Y-%m-%d')

        # The family of report pages about one original page, detected on one
        # machine, on one day. conflict_stem identifies the family;
        # next_conflict_slot/latest_conflict_slot pick a member within it.
        conflict_stem() {
            local date_str
            date_str=$(echo "$1" | tr '_' '-')
            echo "conflict-${MACHINE_NAME}-$TODAY-${date_str}"
        }

        # A never-before-used path in this family - unsuffixed for the first
        # report today, then -2, -3, ... Always fresh, so writers here never
        # append to or overwrite an earlier report; a full write to a new path
        # is bounded by the current divergence, not by what came before.
        next_conflict_slot() {
            local stem="$1" n=1 candidate
            candidate="$LOGSEQ_LOCAL/pages/${stem}.md"
            while [[ -f "$candidate" ]]; do
                n=$((n + 1))
                candidate="$LOGSEQ_LOCAL/pages/${stem}-${n}.md"
            done
            echo "$candidate"
        }

        # The most recently allocated path in this family, or empty if today's
        # family has no members yet.
        latest_conflict_slot() {
            local stem="$1" latest="" max=0 f n
            if [[ -f "$LOGSEQ_LOCAL/pages/${stem}.md" ]]; then
                latest="$LOGSEQ_LOCAL/pages/${stem}.md"
                max=1
            fi
            for f in "$LOGSEQ_LOCAL/pages/${stem}-"*.md; do
                [[ -f "$f" ]] || continue
                n="${f#"$LOGSEQ_LOCAL/pages/${stem}-"}"
                n="${n%.md}"
                [[ "$n" =~ ^[0-9]+$ ]] || continue
                if (( n > max )); then
                    max=$n
                    latest="$f"
                fi
            done
            echo "$latest"
        }

        file_size() {
            stat -f%z "$1" 2>/dev/null || stat -c%s "$1" 2>/dev/null || echo 0
        }

        # Resolve the pre-sync snapshot: prefer the pointer _backup writes,
        # fall back to the newest generation directory directly under
        # BACKUP_DIR if the pointer is missing or stale (e.g. a generation left
        # by a _backup run older than the pointer, or a manual BACKUP_DIR
        # override that _backup never wrote to).
        SNAPSHOT=""
        if [[ -f "$BACKUP_DIR/.last" ]]; then
            SNAPSHOT=$(cat "$BACKUP_DIR/.last" 2>/dev/null || true)
        fi
        if [[ -z "$SNAPSHOT" ]] || [[ ! -d "$SNAPSHOT" ]]; then
            LATEST_GEN=$(cd "$BACKUP_DIR" 2>/dev/null && ls -t 2>/dev/null | head -n 1)
            if [[ -n "$LATEST_GEN" ]]; then
                SNAPSHOT="$BACKUP_DIR/$LATEST_GEN"
            fi
        fi
        if [[ -z "$SNAPSHOT" ]] || [[ ! -d "$SNAPSHOT" ]]; then
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Shrink check: no pre-sync snapshot found, skipping" >> "$LOG_FILE"
            exit 0
        fi

        DETECTED=()

        for sub in journals pages; do
            src_dir="$SNAPSHOT/$sub"
            [[ -d "$src_dir" ]] || continue
            while IFS= read -r -d '' before_file; do
                is_sync_artifact "$before_file" && continue
                rel="${before_file#$src_dir/}"
                full_rel="$sub/$rel"
                before_size=$(file_size "$before_file")
                [[ "$before_size" -lt "$SHRINK_MIN_BYTES" ]] && continue

                # Locate the corresponding post-sync file. Try the name as-is
                # first, then decoded/encoded variants, since rclone may leave
                # URL-encoded basenames locally for characters the remote
                # can't store directly (mirrors sync:logseq:_conflict).
                after_file="$LOGSEQ_LOCAL/$full_rel"
                if [[ ! -f "$after_file" ]]; then
                    decoded_rel=$(url_decode "$full_rel")
                    if [[ -f "$LOGSEQ_LOCAL/$decoded_rel" ]]; then
                        after_file="$LOGSEQ_LOCAL/$decoded_rel"
                    else
                        encoded_rel=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe='/'))" "$full_rel")
                        if [[ -f "$LOGSEQ_LOCAL/$encoded_rel" ]]; then
                            after_file="$LOGSEQ_LOCAL/$encoded_rel"
                        fi
                    fi
                fi

                if [[ -f "$after_file" ]]; then
                    after_size=$(file_size "$after_file")
                else
                    after_size=0
                fi

                if (( after_size * 100 < before_size * SHRINK_RATIO )); then
                    DETECTED+=("$full_rel: ${before_size} -> ${after_size} bytes")

                    basename=$(basename "$before_file" .md)
                    page_name=$(page_name_from_basename "$basename")
                    mkdir -p "$LOGSEQ_LOCAL/pages"
                    # Append to today's most recent report about this page if
                    # one exists (from _conflict earlier in this same run, or
                    # from an earlier round today) rather than allocating a new
                    # slot - a shrink is supplementary information about an
                    # existing report, not an independent event.
                    conflict_page=$(latest_conflict_slot "$(conflict_stem "$basename")")
                    [[ -z "$conflict_page" ]] && conflict_page="$LOGSEQ_LOCAL/pages/$(conflict_stem "$basename").md"
                    timestamp=$(date '+%Y-%m-%d %H:%M:%S')

                    if [[ -f "$conflict_page" ]]; then
                        # A report for this page already exists today - append
                        # rather than overwrite so earlier findings and any
                        # manual edits survive.
                        {
                            echo ""
                            echo "---"
                            echo "## Shrink detected: $timestamp"
                            echo ""
                            echo "[[${page_name}]] shrank from ${before_size} to ${after_size} bytes during sync."
                            echo ""
                            echo "Legend: removed | added | unchanged"
                            echo ""
                            echo '```'
                            if [[ -f "$after_file" ]]; then
                                safe_diff "$before_file" "$after_file"
                            else
                                echo "(file missing after sync)"
                            fi
                            echo '```'
                        } >> "$conflict_page"
                    else
                        {
                            echo "tags:: #conflict"
                            echo "created:: $timestamp"
                            echo ""
                            echo "# Conflict detected: [[${page_name}]]"
                            echo ""
                            echo "[[${page_name}]] shrank from ${before_size} to ${after_size} bytes during sync (possible lost update)."
                            echo "## Diff Summary"
                            echo ""
                            echo "Legend: removed | added | unchanged"
                            echo ""
                            echo '```'
                            if [[ -f "$after_file" ]]; then
                                safe_diff "$before_file" "$after_file"
                            else
                                echo "(file missing after sync)"
                            fi
                            echo '```'
                            echo ""
                            echo "## Version 1 (Pre-sync)"
                            echo "- collapsed:: true"
                            sed 's/^/\t/' "$before_file" 2>/dev/null || echo "(Could not read file: $before_file)"
                            echo ""
                            echo "## Version 2 (Post-sync)"
                            echo "- collapsed:: true"
                            if [[ -f "$after_file" ]]; then
                                sed 's/^/\t/' "$after_file" 2>/dev/null || echo "(Could not read file: $after_file)"
                            else
                                printf '\t(file not found after sync)\n'
                            fi
                            echo ""
                            echo "---"
                            echo "After merging, update and delete this page."
                        } > "$conflict_page"
                    fi
                fi
            done < <(find "$src_dir" -name "*.md" -print0)
        done

        if [[ ${#DETECTED[@]} -gt 0 ]]; then
            {
                echo "$(date '+%Y-%m-%d %H:%M:%S') - Shrink check detected ${#DETECTED[@]} file(s):"
                printf '  %s\n' "${DETECTED[@]}"
            } >> "$LOG_FILE"
            task sync:logseq:notify TITLE="Content Shrink Detected" MESSAGE="Found ${#DETECTED[@]} shrunk file(s) during sync" PRIORITY="high"
        else
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Shrink check: no shrunk files detected" >> "$LOG_FILE"
        fi
        INNEREOF

  notify:
    desc: Send OS notification for logseq sync
    vars:
      TITLE: '{{.TITLE | default "Logseq Sync"}}'
      MESSAGE: '{{.MESSAGE | default "Sync operation completed"}}'
      PRIORITY: '{{.PRIORITY | default "normal"}}'
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        TITLE="{{.TITLE}}"
        MESSAGE="{{.MESSAGE}}"
        PRIORITY="{{.PRIORITY}}"
        # Test hook: LOGSEQ_SYNC_NO_NOTIFY lets shrink_check_test.sh (and any
        # other automated caller) exercise the notify-on-detection code path
        # without actually popping an OS notification (osascript on macOS,
        # etc). Left unset in normal/production use.
        if [[ -n "${LOGSEQ_SYNC_NO_NOTIFY:-}" ]]; then
            exit 0
        fi
        if [[ "$(uname)" == "Darwin" ]]; then
            osascript -e "display notification \"$MESSAGE\" with title \"$TITLE\"" 2>/dev/null || true
        elif [[ -n "${TERMUX_VERSION:-}" ]] || [[ -d /data/data/com.termux ]]; then
            if command -v termux-notification &>/dev/null; then
                case "$PRIORITY" in
                    high) termux-notification --title "$TITLE" --content "$MESSAGE" --priority high 2>/dev/null || true ;;
                    low) termux-notification --title "$TITLE" --content "$MESSAGE" --priority low 2>/dev/null || true ;;
                    *) termux-notification --title "$TITLE" --content "$MESSAGE" 2>/dev/null || true ;;
                esac
            fi
        elif grep -qi microsoft /proc/version 2>/dev/null || [[ -f /etc/os-release ]]; then
            if command -v notify-send &>/dev/null; then
                case "$PRIORITY" in
                    high) notify-send -u critical "$TITLE" "$MESSAGE" 2>/dev/null || true ;;
                    low) notify-send -u low "$TITLE" "$MESSAGE" 2>/dev/null || true ;;
                    *) notify-send "$TITLE" "$MESSAGE" 2>/dev/null || true ;;
                esac
            fi
        fi
        INNEREOF

  setup:
    desc: Setup automatic logseq sync scheduling for current platform
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        if [[ "$(uname)" == "Darwin" ]]; then
            echo "On macOS, logseq sync is managed via home-manager launchd.agents."
            echo "Run: home-manager switch --flake ~/dotfiles#r-shibuya"
        elif [[ -n "${TERMUX_VERSION:-}" ]] || [[ -d /data/data/com.termux ]]; then
            task sync:logseq:schedule-termux
        elif [[ -d /run/systemd/system ]]; then
            task sync:logseq:schedule-systemd
        else
            task sync:logseq:schedule-cron
        fi
        INNEREOF

  remove:
    desc: Remove logseq sync scheduling for current platform
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        if [[ "$(uname)" == "Darwin" ]]; then
            echo "On macOS, logseq sync is managed via home-manager launchd.agents."
            echo "To disable, set launchd.agents.logseq-sync.enable = false in profiles/r-shibuya.nix"
        elif [[ -n "${TERMUX_VERSION:-}" ]] || [[ -d /data/data/com.termux ]]; then
            task sync:logseq:schedule-termux-remove
        elif [[ -d /run/systemd/system ]]; then
            task sync:logseq:schedule-systemd-remove
        else
            task sync:logseq:schedule-cron-remove
        fi
        INNEREOF

  status:
    desc: Show logseq sync scheduling status for current platform
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        if [[ "$(uname)" == "Darwin" ]]; then
            echo "=== macOS launchd (managed by home-manager) ==="
            launchctl list | grep com.logseq.sync || echo "Not loaded"
        elif [[ -n "${TERMUX_VERSION:-}" ]] || [[ -d /data/data/com.termux ]]; then
            task sync:logseq:schedule-termux-status
        elif [[ -d /run/systemd/system ]]; then
            task sync:logseq:schedule-systemd-status
        else
            task sync:logseq:schedule-cron-status
        fi
        INNEREOF

  shortcut:
    desc: Create Termux shortcut for logseq sync
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        mkdir -p "$HOME/.shortcuts"
        DOTFILES_DIR="{{.DOTFILES_DIR | default (env "HOME") }}/dotfiles"
        TEMPLATE="$DOTFILES_DIR/tasks/sync/logseq/templates/termux/logseq-sync-shortcut.sh"
        OUTPUT="$HOME/.shortcuts/logseq-sync"
        
        # Generate shortcut from template with __VAR__ substitution
        sed "s|__DOTFILES_DIR__|$DOTFILES_DIR|g" "$TEMPLATE" > "$OUTPUT"
        chmod +x "$OUTPUT"
        echo "Termux shortcut created at $OUTPUT"
        INNEREOF

  schedule-systemd:
    desc: Setup systemd service and timer for logseq sync
    vars:
      LOGSEQ_SYNC_INTERVAL: '{{.LOGSEQ_SYNC_INTERVAL | default "1800"}}'
    cmds:
      - mkdir -p "$HOME/.config/systemd/user"
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        DOTFILES_DIR="{{.DOTFILES_DIR | default (env "HOME") }}/dotfiles"
        TEMPLATE_DIR="$DOTFILES_DIR/tasks/sync/logseq/templates/systemd"
        LOG_FILE="{{.LOG_FILE}}"
        
        # Generate service file
        sed "s|__DOTFILES_DIR__|$DOTFILES_DIR|g" "$TEMPLATE_DIR/logseq-sync.service" \
          | sed "s|__HOME__|$HOME|g" \
          | sed "s|__PATH__|$PATH|g" \
          | sed "s|__LOGSEQ_LOCAL__|{{.LOGSEQ_LOCAL}}|g" \
          | sed "s|__LOGSEQ_REMOTE__|{{.LOGSEQ_REMOTE}}|g" \
          | sed "s|__LOG_FILE__|$LOG_FILE|g" \
          > "$HOME/.config/systemd/user/logseq-sync.service"
        
        # Generate timer file with interval
        sed "s|__LOGSEQ_SYNC_INTERVAL__|{{.LOGSEQ_SYNC_INTERVAL}}|g" "$TEMPLATE_DIR/logseq-sync.timer" \
          > "$HOME/.config/systemd/user/logseq-sync.timer"
        
        # Reload and enable
        systemctl --user daemon-reload
        systemctl --user enable --now logseq-sync.timer
        echo "systemd timer enabled: logseq-sync.timer"
        INNEREOF

  schedule-systemd-status:
    desc: Show systemd timer status
    cmds:
      - systemctl --user list-timers | grep logseq-sync || echo "Timer not found"
      - systemctl --user status logseq-sync.timer 2>/dev/null || true

  schedule-systemd-remove:
    desc: Remove systemd service and timer
    cmds:
      - systemctl --user disable --now logseq-sync.timer 2>/dev/null || true
      - systemctl --user disable --now logseq-sync.service 2>/dev/null || true
      - rm -f "$HOME/.config/systemd/user/logseq-sync.service" "$HOME/.config/systemd/user/logseq-sync.timer"
      - systemctl --user daemon-reload
      - echo "systemd service and timer removed"

  schedule-cron:
    desc: Setup cron job for logseq sync
    vars:
      LOGSEQ_SYNC_INTERVAL: '{{.LOGSEQ_SYNC_INTERVAL | default "1800"}}'
    cmds:
      - mkdir -p "$HOME/.local/share/cron"
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        DOTFILES_DIR="{{.DOTFILES_DIR | default (env "HOME") }}/dotfiles"
        TEMPLATE="$DOTFILES_DIR/tasks/sync/logseq/templates/cron/logseq-sync.cron"
        OUTPUT="$HOME/.local/share/cron/logseq-sync"
        LOG_FILE="{{.LOG_FILE}}"
        LOG_FILE_ERROR="$(echo "$LOG_FILE" | sed 's/\.log$/-error.log/')"
        CRON_INTERVAL=$(( ({{.LOGSEQ_SYNC_INTERVAL | default "1800"}} + 59) / 60 ))
        
        # Generate cron file from template with __VAR__ substitution
        sed "s|__DOTFILES_DIR__|$DOTFILES_DIR|g" "$TEMPLATE" \
          | sed "s|__HOME__|$HOME|g" \
          | sed "s|__PATH__|$PATH|g" \
          | sed "s|__LOGSEQ_LOCAL__|{{.LOGSEQ_LOCAL}}|g" \
          | sed "s|__LOGSEQ_REMOTE__|{{.LOGSEQ_REMOTE}}|g" \
          | sed "s|__LOG_FILE__|$LOG_FILE|g" \
          | sed "s|__LOG_FILE_ERROR__|$LOG_FILE_ERROR|g" \
          | sed "s|__CRON_INTERVAL__|$CRON_INTERVAL|g" \
          > "$OUTPUT"
        
        # Install cron job - preserve existing entries, only replace logseq-sync line
        # Create temp file with existing crontab + new entry (excluding old logseq-sync)
        TEMP_CRONTAB=$(mktemp)
        { crontab -l 2>/dev/null | grep -v "logseq-sync"; cat "$OUTPUT"; } > "$TEMP_CRONTAB"
        crontab "$TEMP_CRONTAB"
        rm -f "$TEMP_CRONTAB"
        echo "Cron job installed"
        INNEREOF

  schedule-cron-status:
    desc: Show cron job status
    cmds:
      - crontab -l 2>/dev/null | grep logseq-sync || echo "Cron job not found"

  schedule-cron-remove:
    desc: Remove cron job
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        TEMP_CRONTAB=$(mktemp)
        crontab -l 2>/dev/null | grep -v "logseq-sync" > "$TEMP_CRONTAB"
        crontab "$TEMP_CRONTAB"
        rm -f "$TEMP_CRONTAB" "$HOME/.local/share/cron/logseq-sync"
        echo "Cron job removed"
        INNEREOF

  schedule-termux:
    desc: Setup Termux service for logseq sync
    vars:
      LOGSEQ_SYNC_INTERVAL: '{{.LOGSEQ_SYNC_INTERVAL | default "1800"}}'
    cmds:
      - mkdir -p "$HOME/.termux/boot"
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        DOTFILES_DIR="{{.DOTFILES_DIR | default (env "HOME") }}/dotfiles"
        TEMPLATE="$DOTFILES_DIR/tasks/sync/logseq/templates/termux/logseq-sync.sh"
        OUTPUT="$HOME/.termux/boot/logseq-sync"
        LOG_FILE="{{.LOG_FILE}}"
        LOG_FILE_ERROR="$(echo "$LOG_FILE" | sed 's/\.log$/-error.log/')"
        
        # Generate boot script from template with __VAR__ substitution
        sed "s|__DOTFILES_DIR__|$DOTFILES_DIR|g" "$TEMPLATE" \
          | sed "s|__HOME__|$HOME|g" \
          | sed "s|__PATH__|$PATH|g" \
          | sed "s|__LOGSEQ_LOCAL__|{{.LOGSEQ_LOCAL}}|g" \
          | sed "s|__LOGSEQ_REMOTE__|{{.LOGSEQ_REMOTE}}|g" \
          | sed "s|__LOG_FILE__|$LOG_FILE|g" \
          | sed "s|__LOG_FILE_ERROR__|$LOG_FILE_ERROR|g" \
          > "$OUTPUT"
        
        chmod +x "$OUTPUT"
        
        # For periodic execution in Termux, also set up cron
        # Since Termux boot scripts only run at startup
        if command -v crontab &>/dev/null; then
            # Create a cron entry for periodic sync (every 30 minutes)
            CRON_LINE="*/30 * * * * $OUTPUT >> $LOG_FILE 2>> $LOG_FILE_ERROR"
            TEMP_CRONTAB=$(mktemp)
            { crontab -l 2>/dev/null | grep -v "logseq-sync"; echo "$CRON_LINE"; } > "$TEMP_CRONTAB"
            crontab "$TEMP_CRONTAB"
            rm -f "$TEMP_CRONTAB"
            echo "Cron job also installed for periodic sync"
        fi
        
        echo "Termux boot script installed: $OUTPUT"
        INNEREOF

  schedule-termux-status:
    desc: Show Termux service status
    cmds:
      - ls -la "$HOME/.termux/boot/logseq-sync" 2>/dev/null || echo "Boot script not found"

  schedule-termux-remove:
    desc: Remove Termux service
    cmds:
      - |
        bash <<'INNEREOF'
        set -euo pipefail
        rm -f "$HOME/.termux/boot/logseq-sync"
        
        # Also remove cron entry if exists
        if command -v crontab &>/dev/null; then
            TEMP_CRONTAB=$(mktemp)
            crontab -l 2>/dev/null | grep -v "logseq-sync" > "$TEMP_CRONTAB"
            crontab "$TEMP_CRONTAB"
            rm -f "$TEMP_CRONTAB"
            echo "Cron entry removed"
        fi
        
        echo "Termux boot script removed"
        INNEREOF
