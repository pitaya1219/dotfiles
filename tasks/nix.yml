version: '3'

vars:
  # Where you want to reach the sandbox from. One per checkout by default, so
  # that sessions working on different clones cannot activate into the same
  # directory at once: a shared default would leave whichever ran last owning
  # the $HOME/dotfiles symlink, and the other exercising its scripts.
  SANDBOX_HOME:
    sh: 'printf "/tmp/dotfiles-sandbox-%s\n" "$(printf "%s" "{{.ROOT_DIR}}" | cksum | cut -d" " -f1)"'

  # Where it actually lives. Unix socket paths cap at 104 bytes on macOS and
  # configurations activated here bind sockets under $HOME/.config -- herdr's
  # .config/herdr/herdr.sock accounts for 25 of them -- so a requested home too
  # deep to leave room for one is relocated under /tmp, and SANDBOX_HOME
  # becomes a symlink pointing at it. The ceiling keeps room for a socket
  # somewhat deeper than herdr's. Naming the relocated directory after a
  # checksum of the requested path makes it the same directory on every run and
  # a different one per caller.
  SANDBOX_REAL_HOME:
    sh: |
      requested='{{.SANDBOX_HOME}}'
      if [ "${#requested}" -le 48 ]; then
        printf '%s\n' "$requested"
      else
        printf '/tmp/sbx-%s\n' "$(printf '%s' "$requested" | cksum | cut -d' ' -f1)"
      fi

  # HERDR_SOCKET_PATH and NIX_PROFILES hold absolute paths into the real home,
  # so overriding HOME alone leaves a sandbox talking to the live herdr session
  # and resolving the live profiles.
  #
  # PASSAGE_DIR and PASSAGE_IDENTITIES_FILE go the other way: passage
  # (lib/passage-secrets.nix) resolves both relative to $HOME by default, and
  # a throwaway sandbox home never has a store or identity under it, so any
  # profile with a passageSecrets/passageAuthorizedKeys/passageKnownHosts
  # entry -- droid, rose, aviateur, lepetitprince -- fails activation outright
  # ("You must place an age identity at ...") rather than merely leaving a
  # feature untested. Pinning both to the real home before HOME is overridden
  # keeps the sandbox reading real secrets, the same way `nix:sandbox` already
  # symlinks $HOME/dotfiles back to the checkout under test rather than
  # leaving it absent.
  SANDBOX_ENV: >-
    env -u HERDR_SOCKET_PATH -u HERDR_ENV -u NIX_PROFILES
    PASSAGE_DIR="${PASSAGE_DIR:-$HOME/.passage/store}"
    PASSAGE_IDENTITIES_FILE="${PASSAGE_IDENTITIES_FILE:-$HOME/.passage/identities}"

tasks:
  default:
    cmds:
      - task --list-all
    silent: true
  clean:
    desc: Clean up Nix store
    silent: true
    vars:
      KEEP_DAYS: '{{.KEEP_DAYS | default "7"}}'
      KEEP_MIN: '{{.KEEP_MIN | default "5"}}'
      # `profile` (see below) only tracks the home-manager tool's own
      # build, not the user's actual config, and is bumped rarely (only on
      # `task nix:upgrade`, not every switch) -- most of its history is
      # duplicate "No changes" copies, so a much shallower floor is fine.
      KEEP_MIN_PROFILE: '{{.KEEP_MIN_PROFILE | default "2"}}'
    cmds:
      - |
        # BSD date (macOS) vs GNU date (Linux) relative-date syntax.
        if date -v-1d >/dev/null 2>&1; then
          CUTOFF=$(date -v-{{.KEEP_DAYS}}d +%Y-%m-%d)
        else
          CUTOFF=$(date -d "-{{.KEEP_DAYS}} days" +%Y-%m-%d)
        fi

        # nix always colorizes "profile history" output, so strip ANSI
        # codes before parsing dates out of it.
        wipe_profile() {
          local profile="$1" keep_min="$2"
          local recent
          recent=$(nix profile history --profile "$profile" 2>&1 \
            | perl -pe 's/\e\[[0-9;]*m//g' \
            | awk '/^Version/{print $3}' | tr -d '()' \
            | awk -v cutoff="$CUTOFF" '$0 >= cutoff' | wc -l)

          # --older-than alone can wipe every generation down to the
          # current one if switches have been sporadic. Only wipe by age
          # once at least keep_min generations would still survive it.
          if [ "$recent" -lt "$keep_min" ]; then
            echo "$profile: only $recent generation(s) within {{.KEEP_DAYS}}d (need $keep_min); skipping wipe-history"
          else
            nix profile wipe-history --profile "$profile" --older-than {{.KEEP_DAYS}}d
          fi
        }

        # `home-manager` is the profile home-manager switch itself manages.
        # `profile` is a separate, unnamed default profile that `nix run
        # home-manager/master -- switch` also bumps whenever `nix flake
        # update` moves home-manager's own pinned commit -- easy to miss
        # since it doesn't grow on every switch, only on every upgrade.
        wipe_profile "$HOME/.local/state/nix/profiles/home-manager" {{.KEEP_MIN}}
        wipe_profile "$HOME/.local/state/nix/profiles/profile" {{.KEEP_MIN_PROFILE}}

        nix store gc

        # A collection can leave a path gone from disk while the database
        # still records it as valid. Nothing re-fetches such a path: builds
        # that need it fail with FileNotFound on a store path nix insists
        # exists, and the failure surfaces far from here -- what broke was a
        # fixed-output dependency several derivations down.
        #
        # --verify deregisters those, which is enough; the next build then
        # fetches them through the normal path. --check-contents is left off
        # deliberately -- it re-hashes every valid path in the store, and the
        # inconsistency this guards against is a missing file, not an altered
        # one.
        nix-store --verify
  sandbox:
    desc: Activate this checkout against a throwaway home directory and open a shell in it
    silent: true
    vars:
      PROFILE: '{{.PROFILE | default .USER}}'
    cmds:
      - |
        set -euo pipefail
        mkdir -p "{{.SANDBOX_REAL_HOME}}"

        if [ "{{.SANDBOX_REAL_HOME}}" != "{{.SANDBOX_HOME}}" ]; then
          if [ -e "{{.SANDBOX_HOME}}" ] && [ ! -L "{{.SANDBOX_HOME}}" ]; then
            echo "{{.SANDBOX_HOME}} already exists and is not a symlink; move it aside or choose another SANDBOX_HOME." >&2
            exit 1
          fi
          ln -sfn "{{.SANDBOX_REAL_HOME}}" "{{.SANDBOX_HOME}}"
          echo "{{.SANDBOX_HOME}} is too deep to hold a unix socket."
          echo "The sandbox lives at {{.SANDBOX_REAL_HOME}} and is linked from there."
        fi

        # Paths written as $HOME/dotfiles/scripts/... have to land on this
        # checkout, so that what runs in the sandbox is the change under test
        # and not whatever is already deployed.
        ln -sfn "$PWD" "{{.SANDBOX_REAL_HOME}}/dotfiles"

        # Agent credentials sit outside anything home-manager deploys, so a
        # sandbox home starts logged out and every agent in it drops into its
        # onboarding flow. Both are linked rather than copied so that a
        # re-authentication inside the sandbox lands where the real session
        # reads it, the same trade already made for PASSAGE_DIR above.
        #
        # Claude Code holds its OAuth token in the login keychain, which is
        # found through the search list macOS derives from
        # $HOME/Library/Keychains. Move $HOME and the list collapses to
        # System.keychain alone, leaving the token invisible rather than
        # merely locked.
        if [ -d "$HOME/Library/Keychains" ]; then
          mkdir -p "{{.SANDBOX_REAL_HOME}}/Library"
          ln -sfn "$HOME/Library/Keychains" "{{.SANDBOX_REAL_HOME}}/Library/Keychains"
        fi

        # Vibe reads MISTRAL_API_KEY from $HOME/.vibe/.env. Only that file is
        # shared: .vibe/config.toml is generated by the activation under test,
        # so the sandbox has to keep its own.
        if [ -f "$HOME/.vibe/.env" ]; then
          mkdir -p "{{.SANDBOX_REAL_HOME}}/.vibe"
          ln -sfn "$HOME/.vibe/.env" "{{.SANDBOX_REAL_HOME}}/.vibe/.env"
        fi

        DOTFILES_SANDBOX_HOME="{{.SANDBOX_REAL_HOME}}" nix build --impure \
          ".#sandboxConfigurations.{{.PROFILE}}.activationPackage" \
          --out-link "{{.SANDBOX_REAL_HOME}}/.activation-package"

        {{.SANDBOX_ENV}} HOME="{{.SANDBOX_REAL_HOME}}" \
          "{{.SANDBOX_REAL_HOME}}/.activation-package/activate"
      - task: sandbox:shell

  sandbox:shell:
    desc: Open a login shell in an existing sandbox home without re-activating it
    silent: true
    preconditions:
      - sh: '[ -x "{{.SANDBOX_REAL_HOME}}/.nix-profile/bin/bash" ]'
        msg: "{{.SANDBOX_REAL_HOME}} has no activated profile. Run `task nix:sandbox` first."
    cmds:
      - |
        echo "Sandbox home: {{.SANDBOX_REAL_HOME}}"
        echo "Exit the shell to return."
        {{.SANDBOX_ENV}} HOME="{{.SANDBOX_REAL_HOME}}" \
          "{{.SANDBOX_REAL_HOME}}/.nix-profile/bin/bash" -l

  sandbox:clean:
    desc: Remove a sandbox home directory created by nix:sandbox
    silent: true
    preconditions:
      - sh: '[ -e "{{.SANDBOX_REAL_HOME}}/.activation-package" ]'
        msg: "{{.SANDBOX_REAL_HOME}} does not look like a sandbox home; refusing to remove it."
    cmds:
      - |
        rm -rf "{{.SANDBOX_REAL_HOME}}"
        # The pointer exists only for a sandbox that had to be relocated.
        if [ -L "{{.SANDBOX_HOME}}" ]; then
          rm -f "{{.SANDBOX_HOME}}"
        fi
        echo "Removed {{.SANDBOX_REAL_HOME}}"

  upgrade:
    desc: Update Nix flake inputs and rebuild
    cmds:
      - |
        echo "Updating flake inputs..."
        nix flake update
        echo "Rebuilding configuration..."
        nix run home-manager/master -- switch --flake .#{{.USER}}
  rollback:
    desc: Rollback home-manager to previous generation
    silent: true
    cmds:
      - |
        echo "🔄 Rolling back home-manager to previous generation..."
        # Source Nix profile if it exists
        if [ -f ~/.nix-profile/etc/profile.d/nix.sh ]; then
          source ~/.nix-profile/etc/profile.d/nix.sh
        fi

        # List recent generations
        echo "📋 Recent home-manager generations:"
        nix profile history --profile ~/.local/state/nix/profiles/home-manager | sed -n '1,10p'

        # Perform rollback
        echo ""
        echo "⏪ Performing rollback..."
        nix profile rollback --profile ~/.local/state/nix/profiles/home-manager

        echo "✅ Rollback complete!"
        echo ""
        echo "Current generation:"
        nix profile history --profile ~/.local/state/nix/profiles/home-manager | sed -n '1,3p'
  get_github_hash:*:*:*:
    desk:
    silent: true
    vars:
      OWNER: "{{index .MATCH 0}}"
      REPO: "{{index .MATCH 1}}"
      REVISION: "{{index .MATCH 2}}"
    cmds:
      - |
        nix-prefetch-url --unpack https://github.com/{{.OWNER}}/{{.REPO}}/archive/{{.REVISION}}.tar.gz
