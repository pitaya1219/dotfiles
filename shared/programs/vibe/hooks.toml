# Mistral Vibe Hooks Configuration
# https://github.com/mistralai/mistral-vibe#hooks-experimental

# secret_guard.py's placement and imports are explained in vibe.nix,
# next to the home.file entry that puts it at ~/.vibe/hooks/secret_guard.py.
[[hooks]]
name = "secret-guard-pre-tool"
type = "pre_tool"
match = "bash"
command = "python3 $HOME/.vibe/hooks/secret_guard.py"
description = "Deny bash commands that are likely to dump secrets to stdout."

[[hooks]]
name = "secret-guard-post-tool"
type = "post_tool"
match = "re:(bash|read_file|grep)"
command = "python3 $HOME/.vibe/hooks/secret_guard.py"
description = "Redact secret-shaped strings from tool output before the model sees them."

# Notification on agent turn completion (equivalent to Claude Code's Stop hook).
# post_agent fires once per completed user turn — the correct "waiting for
# response" signal. Tool-level hooks (pre_tool/post_tool) are intentionally
# omitted to keep notifications quiet.
[[hooks]]
name = "notify-agent-turn"
type = "post_agent"
command = "$HOME/dotfiles/scripts/vibe-notify.sh"
timeout = 30.0
strict = false
description = "Notify on agent turn completion"

# Re-inject the language steering signal after every tool call. The policy
# in AGENTS.md sits at the top of the context and its influence dilutes
# over long sessions; this keeps it close to the generation point.
[[hooks]]
name = "language-steering"
type = "post_tool"
command = "python3 $HOME/.vibe/hooks/language_steering.py"
strict = false
description = "Append language reminder (English reasoning, Japanese response, no Chinese) to every tool result."

# Report session_id to the host multiplexer, nvim or herdr (see
# scripts/agent-session-tab-pointer.py).
# Registered on both pre_tool (no match = all tools, fires as early as the
# first tool call within the first turn) and post_agent (fallback for
# turns that never call a tool). The script no-ops once the pointer file
# for this tab already exists, so pre_tool firing on every later tool call
# is cheap.
#
# --state additionally drives herdr's sidebar. Vibe ships no herdr detection
# manifest, so unlike Claude Code it has to report its own lifecycle, and these
# two hooks are the only signals available — a permission prompt is not
# distinguishable from ordinary work, so "blocked" is never reported.
[[hooks]]
name = "session-tab-pointer-pre-tool"
type = "pre_tool"
command = "$HOME/dotfiles/scripts/agent-session-tab-pointer.py --agent vibe --state working"
timeout = 10.0
strict = false
description = "Report session_id and working state to the host multiplexer (early: first tool call)"

[[hooks]]
name = "session-tab-pointer-post-agent"
type = "post_agent"
command = "$HOME/dotfiles/scripts/agent-session-tab-pointer.py --agent vibe --state idle"
timeout = 10.0
strict = false
description = "Report session_id and idle state to the host multiplexer (fallback: turn end)"
