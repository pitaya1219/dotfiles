textual_theme = "catppuccin-mocha"

# Enable experimental hooks for RocketChat notifications
enable_experimental_hooks = true

# Verify outbound HTTPS against the OS trust store instead of the bundled
# certifi roots. Vibe's build_ssl_context() defaults to certifi only and reads
# no CA env var other than SSL_CERT_FILE / SSL_CERT_DIR, so on the corp network
# the Netskope MITM CA is never loaded and every request fails with
# CERTIFICATE_VERIFY_FAILED. The keychain already holds that CA, and going
# through it keeps working if the certificate is rotated or its path changes.
enable_system_trust_store = true

[[mcp_servers]]
name = "gitea"
transport = "stdio"
command = "$HOME/.vibe/gitea-mcp-wrapper.sh"
startup_timeout_sec = 10
tool_timeout_sec = 60
